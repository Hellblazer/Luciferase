name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands. Saves CI
# minutes on rapid PR pushes; main branch runs are not cancelled
# (cancel-in-progress only applies within a single concurrency group, and
# each main push starts its own group via the SHA in the ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages and compiled artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: luciferase-maven-${{ github.sha }}
          restore-keys: |
            luciferase-maven-${{ github.ref }}-
            luciferase-maven-refs/heads/main-
            luciferase-maven-

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-prime-mover</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compile all modules
        run: ./mvnw -batch-mode clean test-compile install -DskipTests --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Save Maven cache after compile
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: luciferase-maven-${{ github.sha }}

  test-batch-1:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Maven cache from compile job
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            **/target/
          key: luciferase-maven-${{ github.sha }}
          restore-keys: |
            luciferase-maven-${{ github.ref }}-
            luciferase-maven-refs/heads/main-
            luciferase-maven-
          fail-on-cache-miss: false

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-prime-mover</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglu1-mesa libxrandr2 libxcursor1 libxinerama1 libxi6 libxxf86vm1

      - name: Test Batch 1 (Fast unit tests - bubble, behavior, metrics, lifecycle, config, events)
        run: |
          export DISPLAY=:99.0
          # -Pci-batch-1 sets surefire <includes> for this batch's packages.
          # Unlike -Dtest, <includes> composes with excludedGroups so
          # @Tag("performance") tests are correctly skipped. See Luciferase-nz5.
          xvfb-run -a ./mvnw -batch-mode surefire:test -pl simulation -Pci-batch-1 --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

